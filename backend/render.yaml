services:
  - type: web
    name: heritagelink-api
    env: node
    plan: free
    buildCommand: yarn install
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: heritagelink-db
          property: connectionString