services:
  - type: web
    name: heritagelink
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: heritagelink-db
          property: connectionString

databases:
  - name: heritagelink-db
    databaseName: heritagelink
    user: heritagelink_user
    plan: free